plugins {
  id 'java'
  id 'groovy'
}

// Java 21 LTS compatibility
java {
  sourceCompatibility = JavaVersion.VERSION_21
  targetCompatibility = JavaVersion.VERSION_21
}

repositories {
  mavenCentral()
}

sourceSets {
  main {
    java { srcDirs = [] }
    groovy { srcDirs += ['src/main'] }
  }
  test {
    java { srcDirs = [] }
    groovy { srcDirs += ['src/test'] }
  }
}

// LibGDX version
ext {
  gdxVersion = '1.14.0'
  javacvVersion = '1.5.12'
  ffmpegVersion = '7.1.1-1.5.12'
  appVersion = '1.0.0'
}

dependencies {
  // Groovy 5.0 - Java 21 compatible
  implementation 'org.apache.groovy:groovy:5.0.3'
  implementation 'org.apache.groovy:groovy-json:5.0.3'

  // Common lib for logging
  implementation 'org.slf4j:slf4j-api:2.0.17'
  implementation 'org.slf4j:slf4j-simple:2.0.17'

  // Websocket library used to communicate with the UI
  implementation 'org.java-websocket:Java-WebSocket:1.6.0'

  // LibGDX - Cross-platform graphics (replaces JOGL)
  implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  // Headless backend for Raspberry Pi / server mode
  implementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"

  // JavaCV for cross-platform video playback (replacing Processing video library)
  // Core JavaCV and JavaCPP
  implementation "org.bytedeco:javacv:$javacvVersion"

  // FFmpeg Java bindings (for video decoding)
  implementation "org.bytedeco:ffmpeg:$ffmpegVersion"

  // Platform-specific native libraries
  // macOS ARM64 (Apple Silicon)
  implementation "org.bytedeco:ffmpeg:$ffmpegVersion:macosx-arm64"
  // macOS x86_64 (Intel)
  implementation "org.bytedeco:ffmpeg:$ffmpegVersion:macosx-x86_64"
  // Linux x86_64
  implementation "org.bytedeco:ffmpeg:$ffmpegVersion:linux-x86_64"
  // Linux ARM64 (Raspberry Pi 4/5 64-bit)
  implementation "org.bytedeco:ffmpeg:$ffmpegVersion:linux-arm64"
  // Note: linux-armhf (32-bit) dropped in JavaCV 1.5.12+

  // JavaCPP platform natives (required by JavaCV)
  implementation "org.bytedeco:javacpp:$javacvVersion:macosx-arm64"
  implementation "org.bytedeco:javacpp:$javacvVersion:macosx-x86_64"
  implementation "org.bytedeco:javacpp:$javacvVersion:linux-x86_64"
  implementation "org.bytedeco:javacpp:$javacvVersion:linux-arm64"

  // YAML parser used for reading config files
  implementation 'org.yaml:snakeyaml:2.5'

  // Include specific jars from lib directory (PixelPusher and UDP libraries)
  implementation fileTree(dir: 'lib', include: ['PixelPusher/**/*.jar', 'udp/**/*.jar'])

  //////////////// For unit/integration tests

  // JUnit 6 (unified versioning for Platform, Jupiter, Vintage)
  testImplementation 'org.junit.jupiter:junit-jupiter:6.0.1'

  // JUnit 4 for backwards compatibility (most tests still use JUnit 4)
  testImplementation 'junit:junit:4.13.2'

  // JUnit Vintage engine to run JUnit 4 tests with JUnit 6
  testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:6.0.1'

  // Mockito 5.x (Java 21 compatible, inline mock maker is default)
  testImplementation 'org.mockito:mockito-core:5.20.0'

  // Hamcrest junit matchers
  testImplementation 'org.hamcrest:hamcrest:2.2'

  // JUnit Pioneer for environment variable testing (Java 21 compatible)
  testImplementation 'org.junit-pioneer:junit-pioneer:2.3.0'

  // IO utilities
  testImplementation 'commons-io:commons-io:2.21.0'
}

// UDP networking library.
// This library was originally downloaded from Processing's contributed libraries,
// but the prebuilt jar (lib/udp/library/udp.jar) and its source (lib/udp/src/UDP.java)
// are now vendored directly in this repo and picked up by the fileTree dependency above.
// It has no dependency on Processing and requires no network access to build.
//
// This task is retained (as a no-op verification) so existing docs/commands like
// `./gradlew unzipProcessingUdpLibrary fatJar` keep working; `fatJar` alone is sufficient.
tasks.register('unzipProcessingUdpLibrary') {
  description = 'Verifies the vendored UDP library jar is present (no network access).'
  doLast {
    def udpJar = file("${rootDir}/lib/udp/library/udp.jar")
    if (udpJar.exists()) {
      println "Vendored UDP library present: ${udpJar}"
    } else {
      throw new GradleException("Vendored UDP library missing at ${udpJar}. It should be committed to the repo.")
    }
  }
}

// Build fat JAR with all dependencies
tasks.register('fatJar', Jar) {
  manifest {
    attributes 'Main-Class': 'app.TesseractLauncher'
  }
  archiveBaseName = 'TesseractFatJar'
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  from {
    configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
  }
  with jar
}

// Run launcher with Gradle while preserving full JVM exception output.
tasks.register('runLauncher', JavaExec) {
  group = 'application'
  description = 'Runs app.TesseractLauncher'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'app.TesseractLauncher'
  standardInput = System.in
}

// macOS + LWJGL requires starting on the first thread for GLFW window creation.
def isMacOs = System.getProperty('os.name').toLowerCase().contains('mac')
tasks.withType(JavaExec).configureEach {
  if (isMacOs) {
    jvmArgs '-XstartOnFirstThread'
  }
}

// macOS DMG packaging via jpackage (JDK 21+)
// Usage: ./gradlew dmg
// Output: build/dmg/Tesseract Desktop-<version>.dmg
//
// Optional icon: place a 1024x1024 PNG at pkg/macos/icon.png
// See bin/package_dmg.sh for full packaging details.
tasks.register('dmg', Exec) {
  group = 'distribution'
  description = 'Builds a macOS DMG installer for Tesseract Desktop'
  dependsOn fatJar
  commandLine 'bash', 'bin/package_dmg.sh', appVersion
}

test {
  dependsOn cleanTest
  useJUnitPlatform() // Enable JUnit Platform

  // Required for JUnit Pioneer to modify environment variables in Java 21+
  jvmArgs = [
    '--add-opens=java.base/java.util=ALL-UNNAMED',
    '--add-opens=java.base/java.lang=ALL-UNNAMED'
  ]

  testLogging {
    showStandardStreams = true
    events "passed", "skipped", "failed"
    exceptionFormat = 'full'
  }
}
