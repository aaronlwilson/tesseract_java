plugins {
  id "de.undercouch.download" version "5.5.0"
  id 'java'
  id 'groovy'
}

// Java 17 compatibility
java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

repositories {
  mavenCentral()
}

sourceSets {
  main {
    java { srcDirs = [] }
    groovy { srcDirs += ['src/main'] }
  }
  test {
    java { srcDirs = [] }
    groovy { srcDirs += ['src/test'] }
  }
}

// LibGDX version
ext {
  gdxVersion = '1.12.1'
}

dependencies {
  // Groovy 4.0 - Java 17 compatible
  implementation 'org.apache.groovy:groovy:4.0.17'
  implementation 'org.apache.groovy:groovy-json:4.0.17'

  // Common lib for logging
  implementation 'org.slf4j:slf4j-api:2.0.9'
  implementation 'org.slf4j:slf4j-simple:2.0.9'

  // Websocket library used to communicate with the UI
  implementation 'org.java-websocket:Java-WebSocket:1.5.4'

  // LibGDX - Cross-platform graphics (replaces JOGL)
  implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  // Headless backend for Raspberry Pi / server mode
  implementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"

  // JavaCV for cross-platform video playback (replacing Processing video library)
  // Core JavaCV and JavaCPP
  implementation 'org.bytedeco:javacv:1.5.9'

  // FFmpeg Java bindings (for video decoding)
  implementation 'org.bytedeco:ffmpeg:6.0-1.5.9'

  // Platform-specific native libraries
  // macOS ARM64 (Apple Silicon)
  implementation 'org.bytedeco:ffmpeg:6.0-1.5.9:macosx-arm64'
  // macOS x86_64 (Intel)
  implementation 'org.bytedeco:ffmpeg:6.0-1.5.9:macosx-x86_64'
  // Linux x86_64
  implementation 'org.bytedeco:ffmpeg:6.0-1.5.9:linux-x86_64'
  // Linux ARM64 (Raspberry Pi 4 64-bit)
  implementation 'org.bytedeco:ffmpeg:6.0-1.5.9:linux-arm64'
  // Linux ARM (Raspberry Pi 32-bit)
  implementation 'org.bytedeco:ffmpeg:6.0-1.5.9:linux-armhf'

  // JavaCPP platform natives (required by JavaCV)
  implementation 'org.bytedeco:javacpp:1.5.9:macosx-arm64'
  implementation 'org.bytedeco:javacpp:1.5.9:macosx-x86_64'
  implementation 'org.bytedeco:javacpp:1.5.9:linux-x86_64'
  implementation 'org.bytedeco:javacpp:1.5.9:linux-arm64'
  implementation 'org.bytedeco:javacpp:1.5.9:linux-armhf'

  // YAML parser used for reading config files
  implementation 'org.yaml:snakeyaml:2.2'

  // Include specific jars from lib directory (PixelPusher and UDP libraries)
  implementation fileTree(dir: 'lib', include: ['PixelPusher/**/*.jar', 'udp/**/*.jar'])

  //////////////// For unit/integration tests

  // JUnit 4
  testImplementation 'junit:junit:4.13.2'

  // Mockito 4.x (Java 17 compatible, no PowerMock needed)
  testImplementation 'org.mockito:mockito-core:4.11.0'
  testImplementation 'org.mockito:mockito-inline:4.11.0'

  // Hamcrest junit matchers
  testImplementation 'org.hamcrest:hamcrest:2.2'

  // Allows capturing logs and exit status from commands
  testImplementation 'com.github.stefanbirkner:system-rules:1.19.0'

  // IO utilities
  testImplementation 'commons-io:commons-io:2.15.1'
}

import de.undercouch.gradle.tasks.download.Download

task downloadProcessingUdpLibrary(type: Download) {
  src 'http://ubaa.net/shared/processing/udp/udp.zip'
  dest new File("${rootDir}/tmp", 'udp.zip')
  overwrite false
}

task unzipProcessingUdpLibrary(dependsOn: downloadProcessingUdpLibrary) {
  doLast {
    copy {
      println "Unzipping processing udp library"
      from zipTree("${rootDir}/tmp/udp.zip")
      into "${rootDir}/lib"
    }
  }
}

// Build fat JAR with all dependencies
tasks.register('fatJar', Jar) {
  manifest {
    attributes 'Main-Class': 'app.TesseractLauncher'
  }
  archiveBaseName = 'TesseractFatJar'
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  from {
    configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
  }
  with jar
}

test {
  dependsOn cleanTest
  testLogging {
    showStandardStreams = true
    events "passed", "skipped", "failed"
    exceptionFormat = 'full'
  }
}
